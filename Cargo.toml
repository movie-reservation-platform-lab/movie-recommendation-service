[package]
name = "movie_recommendation_service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.6"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "test-util", "time"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
tower = { version = "0.5.2", features = ["util"] }
