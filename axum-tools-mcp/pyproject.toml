[project]
name = "axum-tools-mcp"
version = "0.1.0"
description = "FastMCP wrapper for the Axum movie recommendation demo API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.0.0",
  "httpx>=0.28.1",
  "opentelemetry-api>=1.34.1",
  "opentelemetry-sdk>=1.34.1",
  "opentelemetry-exporter-otlp-proto-http>=1.34.1",
  "opentelemetry-instrumentation-httpx>=0.55b1",
  "starlette>=0.40.0",
  "uvicorn>=0.34.2",
]

[project.scripts]
axum-tools-mcp = "axum_tools_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axum_tools_mcp"]

[dependency-groups]
dev = []

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
